[supervisord]
nodaemon=true
logfile=/app/data/log/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/var/run/supervisord.pid
user=root

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/2
stderr_logfile_maxbytes=0
stdout_events_enabled=true
stderr_events_enabled=true
redirect_stderr=true

[program:gunicorn]
directory=/app
command=gunicorn -b 0.0.0.0:8000 app:app --timeout 120 --max-requests 1000 --workers 5 --preload --access-logfile /dev/null --error-logfile - --log-level info
autorestart=true
stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/2
stderr_logfile_maxbytes=0
stdout_events_enabled=true
stderr_events_enabled=true
redirect_stderr=true

[program:external-stream]
directory=/app
command=gunicorn -b 127.0.0.1:8001 external_stream:app --workers 2 --threads 4 --worker-class gthread --timeout 120 --max-requests 1000 --access-logfile /dev/null --error-logfile -
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/2
stderr_logfile_maxbytes=0
redirect_stderr=true

[program:cache-maintenance]
directory=/app
command=python /app/cache_maintenance.py
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/2
stderr_logfile_maxbytes=0
redirect_stderr=true
